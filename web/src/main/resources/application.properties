server.port=8081
spring.application.name=web

# Endereco do projeto API (usado nas telas de Veiculos e Servicos)
api.url=http://localhost:8080

# Banco H2 em memoria do projeto Web (Funcionarios e Contas do Mes)
spring.datasource.url=jdbc:h2:mem:webdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Cria as tabelas pelas entidades e depois roda o data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
